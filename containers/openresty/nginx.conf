# VAS-managed OpenResty base configuration.
# Everything below /etc/openresty/vas is generated by the manager and
# pulled by the Lua agent (see /usr/local/openresty/site/lualib/vas/agent.lua).

worker_processes auto;
error_log /dev/stderr notice;
pid /usr/local/openresty/nginx/logs/nginx.pid;

# nginx clears the environment of workers and the privileged agent; the agent
# shells out (openresty -t, ln, kill), so PATH must be passed through.
env PATH;
env VAS_MANAGER_URL;
env VAS_AGENT_TOKEN;
env VAS_POLL_INTERVAL;
env VAS_OPENRESTY_DATA;
env VAS_OPENRESTY_BIN;
env VAS_LUAROCKS_BIN;
env HOSTNAME;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;
    server_names_hash_bucket_size 128;

    # /data/luarocks: packages the agent installs with LuaRocks (Settings → OpenResty → Lua packages)
    lua_package_path "/etc/openresty/vas/lua/?.lua;/data/luarocks/share/lua/5.1/?.lua;/data/luarocks/share/lua/5.1/?/init.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/lualib/?.lua;;";
    lua_package_cpath "/data/luarocks/lib/lua/5.1/?.so;;";
    lua_shared_dict vas_limit 10m;
    lua_shared_dict vas_agent 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    init_by_lua_block {
        local process = require "ngx.process"
        local ok, err = process.enable_privileged_agent()
        if not ok then
            ngx.log(ngx.ERR, "cannot enable privileged agent: ", err)
        end
    }

    init_worker_by_lua_block {
        require("vas.agent").init_worker()
        -- optional user hook rendered from the web UI (Settings → OpenResty → init_worker Lua)
        local ok, err = pcall(require, "vas_user.init_worker")
        if not ok and not tostring(err):find("not found", 1, true) then
            ngx.log(ngx.ERR, "vas_user.init_worker: ", err)
        end
    }

    include /etc/openresty/vas/http/*.conf;
}

stream {
    include /etc/openresty/vas/stream/*.conf;
}
